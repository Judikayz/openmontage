name: Cloud Studio tests
on:
  push: {paths: ['cloud-studio/**', '.github/workflows/cloud-studio-*.yml']}
  pull_request: {paths: ['cloud-studio/**', '.github/workflows/cloud-studio-*.yml']}
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: cloud-studio/apps/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run typecheck
      - run: npm test
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: cloud-studio/apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run build
